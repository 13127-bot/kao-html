        <title>การกำหนดสีตัวอักษรทั้งเอกสาร</title>
    </head>
    <body text="#0000FF">
        คบคนดี ร่มเย็น เห็นกันทั่ว<br>
        คบคนชั่ว คนเลว จะเหลวไหล<br>
        คบคนดี มีคุณ อบอุ่นใจ<br>
        คนจัญไร คบค้า พาเป็นพาล<br>
    </body>
